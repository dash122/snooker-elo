<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    body{margin:0;font-family:"Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;background:#f4f3ed;color:#132521;-webkit-font-smoothing:antialiased}
    a{color:#155e52;text-decoration:none}a:hover{color:#185149}
    .disp{font-family:"Barlow Condensed","Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
    .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);color:#63736e;font-size:11px;font-weight:700}
    .kick{margin:0;font-size:12px;letter-spacing:.16em;font-weight:700;color:#82908c}
    .av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
  </style>
</helmet>
<div style="width:390px;height:860px;background:rgba(3,25,21,.7);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
  <div style="background:#fffefa;border-radius:24px 24px 0 0;padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 -24px 70px rgba(5,34,29,.22)">

    <div style="width:38px;height:4px;border-radius:2px;background:rgba(20,65,57,.24);align-self:center"></div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <p class="kick">黃嘉俊開嘅局</p>
      <h2 class="disp" style="margin:0;font-size:30px;line-height:1.05;font-weight:700">今晚 20:00–22:00</h2>
      <p style="margin:0;font-size:14px;color:#63736e">已訂 3 號枱 · 25 分鐘前開</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#f7f6ef">
      <span class="av" style="width:44px;height:44px;background:#356e83;font-size:15px">黃</span>
      <span style="display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0">
        <b style="font-size:15px;font-weight:800">黃嘉俊 <span class="disp" style="font-size:13px;font-weight:600;color:#82908c">1205 ELO</span></b>
        <small style="font-size:12px;color:#63736e">同你差 40 分 · 你哋對過 3 次（1 勝 2 負）</small>
      </span>
      <span style="display:flex;gap:3px;flex:0 0 auto">
        <i style="display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#eef6f0;color:#247d5d;font-style:normal;font-size:11px;font-weight:800">勝</i>
        <i style="display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#fbeeed;color:#ad5149;font-style:normal;font-size:11px;font-weight:800">負</i>
        <i style="display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#eef6f0;color:#247d5d;font-style:normal;font-size:11px;font-weight:800">勝</i>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <p class="kick" style="font-size:11px">打一場點樣嘅局</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="chip" style="height:28px;padding:0 12px;font-size:12px">要讓分</span>
        <span class="chip" style="height:28px;padding:0 12px;font-size:12px">無煙</span>
        <span class="chip" style="height:28px;padding:0 12px;font-size:12px">已訂枱</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <p class="kick" style="font-size:11px">已經加入 · 2 人</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(20,65,57,.12)">
          <span class="av" style="width:30px;height:30px;background:#a66f1d">李</span>
          <span style="display:flex;flex-direction:column;gap:1px;flex-grow:1"><b style="font-size:14px;font-weight:800">李國強</b><small style="font-size:12px;color:#63736e">1160 ELO</small></span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(20,65,57,.12)">
          <span class="av" style="width:30px;height:30px;background:#247d5d">何</span>
          <span style="display:flex;flex-direction:column;gap:1px;flex-grow:1"><b style="font-size:14px;font-weight:800">何家俊</b><small style="font-size:12px;color:#63736e">1042 ELO</small></span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:16px;background:#eef6f0;border:1px solid #cfe0d5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#247d5d" stroke-width="1.9" stroke-linecap="round" style="flex:0 0 auto;margin-top:1px"><path d="M20 6 9 17l-5-5"/></svg>
      <span style="display:flex;flex-direction:column;gap:2px">
        <b style="font-size:13px;font-weight:800;color:#132521">撳「加入」即刻成事</b>
        <small style="font-size:12px;color:#63736e;line-height:1.5">呢場係「第一個就算」，唔使等黃嘉俊回覆。成事之後我哋會開 WhatsApp 畀你哋。</small>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:#155e52;color:#fffefa;font-size:16px;font-weight:800">加入呢場</div>
      <div style="display:flex;gap:8px">
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700;flex-grow:1">分享畀朋友</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700;flex-grow:1">睇黃嘉俊資料</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
