<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    body{margin:0;font-family:"Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;background:#f4f3ed;color:#132521;-webkit-font-smoothing:antialiased}
    a{color:#155e52;text-decoration:none}a:hover{color:#185149}
    .disp{font-family:"Barlow Condensed","Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
    .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);color:#63736e;font-size:11px;font-weight:700}
    .kick{margin:0;font-size:12px;letter-spacing:.16em;font-weight:700;color:#82908c}
    .av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
  </style>
</helmet>
<div style="width:390px;height:740px;background:rgba(3,25,21,.7);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
  <div style="background:#fffefa;border-radius:24px 24px 0 0;padding:26px 20px 26px;display:flex;flex-direction:column;gap:18px;box-shadow:0 -24px 70px rgba(5,34,29,.22)">

    <div style="width:38px;height:4px;border-radius:2px;background:rgba(20,65,57,.24);align-self:center"></div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
      <span style="display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#eef6f0;border:1px solid #cfe0d5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#247d5d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <h2 class="disp" style="margin:0;font-size:28px;font-weight:700">開咗喇</h2>
      <p style="margin:0;font-size:15px;color:#63736e">今晚（一）19:30 → 21:30 · SCAA 會所</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#f7f6ef">
      <span style="display:flex;flex:0 0 auto">
        <span class="av" style="width:28px;height:28px;background:#8a5a2b;font-size:11px;border:2px solid #f7f6ef">陳</span>
        <span class="av" style="width:28px;height:28px;background:#a66f1d;font-size:11px;border:2px solid #f7f6ef;margin-left:-9px">李</span>
        <span class="av" style="width:28px;height:28px;background:#247d5d;font-size:11px;border:2px solid #f7f6ef;margin-left:-9px">何</span>
        <span class="av" style="width:28px;height:28px;background:#63736e;font-size:10px;border:2px solid #f7f6ef;margin-left:-9px">+3</span>
      </span>
      <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
        <b style="font-size:14px;font-weight:800">已經通知咗 6 位球友</b>
        <small style="font-size:12px;color:#63736e">佢哋話咗今晚呢個時段得閒</small>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:#155e52;color:#fffefa;font-size:16px;font-weight:800">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fffefa" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 20.5l1.7-5.5A8.5 8.5 0 1 1 21 11.5Z"/></svg>
        分享落 WhatsApp 群組
      </div>
      <div style="display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700">複製連結</div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:16px;background:#fff2d3">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b5910" stroke-width="1.9" stroke-linecap="round" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
      <span style="display:flex;flex-direction:column;gap:2px">
        <b style="font-size:13px;font-weight:800;color:#8b5910">18:30 仲未有人嘅話，我哋會提你</b>
        <small style="font-size:12px;color:#63736e;line-height:1.5">到時你可以改時間、分享多次，或者取消。</small>
      </span>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;height:44px;font-size:14px;font-weight:700;color:#63736e">睇返個板 ›</div>

  </div>
</div>
</x-dc>
</body>
</html>
