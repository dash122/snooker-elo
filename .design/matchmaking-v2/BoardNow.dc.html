<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    body{margin:0;font-family:"Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;background:#f4f3ed;color:#132521;-webkit-font-smoothing:antialiased}
    a{color:#155e52;text-decoration:none}a:hover{color:#185149}
    .disp{font-family:"Barlow Condensed","Noto Sans TC","PingFang TC",ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
    .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);color:#63736e;font-size:11px;font-weight:700}
    .kick{margin:0;font-size:12px;letter-spacing:.16em;font-weight:700;color:#82908c}
    .av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
  </style>
</helmet>
<div style="width:390px;height:900px;background:#f4f3ed;display:flex;flex-direction:column;gap:0;overflow:hidden">

  <div style="display:flex;flex-direction:column;gap:2px;padding:22px 20px 14px;background:#082c27;color:#f9f7ee">
    <span class="disp" style="font-size:12px;letter-spacing:.2em;font-weight:600;color:#bdd0c9">而家嘅版本</span>
    <span class="disp" style="font-size:26px;line-height:1;font-weight:700">約戰</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px">

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:#155e52;color:#fffefa;font-size:16px;font-weight:800">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fffefa" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      立即約局
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><b style="font-size:13px">選擇日期</b></div>
      <div style="display:flex;gap:8px;overflow:hidden">
        <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:80px;height:76px;border-radius:12px;background:#0d443a;color:#f9f7ee;flex:0 0 auto"><small style="font-size:11px;color:#bdd0c9">全部</small><span style="font-size:13px;font-weight:700">日子</span><strong class="disp" style="font-size:13px;color:#d5a94d">6 場</strong></span>
        <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:80px;height:76px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);flex:0 0 auto"><small style="font-size:11px;color:#63736e">今天</small><span class="disp" style="font-size:15px;font-weight:700">8/25</span><strong class="disp" style="font-size:13px;color:#63736e">4 場</strong></span>
        <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:80px;height:76px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);flex:0 0 auto"><small style="font-size:11px;color:#63736e">明天</small><span class="disp" style="font-size:15px;font-weight:700">8/26</span><strong class="disp" style="font-size:13px;color:#63736e">1 場</strong></span>
        <span style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:80px;height:76px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);flex:0 0 auto"><small style="font-size:11px;color:#63736e">三</small><span class="disp" style="font-size:15px;font-weight:700">8/27</span><strong class="disp" style="font-size:13px;color:#63736e">0 場</strong></span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">

      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(20,65,57,.12);border-radius:20px;background:#fffefa">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;flex:0 0 auto"><b class="disp" style="font-size:20px;line-height:1">今晚</b><small style="font-size:12px;color:#82908c">19:30 · 2 個鐘</small></span>
        <span style="align-self:stretch;width:1px;background:rgba(20,65,57,.12);flex:0 0 auto"></span>
        <span class="av" style="width:32px;height:32px;background:#8a5a2b">陳</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
          <b style="font-size:14px;font-weight:800">陳志明</b>
          <small style="font-size:13px;color:#63736e">SCAA 會所 · 1 人已報名</small>
        </span>
        <span style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700;flex:0 0 auto">加入</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(20,65,57,.12);border-radius:20px;background:#fffefa">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;flex:0 0 auto"><b class="disp" style="font-size:20px;line-height:1">今晚</b><small style="font-size:12px;color:#82908c">20:00 · 2 個鐘</small></span>
        <span style="align-self:stretch;width:1px;background:rgba(20,65,57,.12);flex:0 0 auto"></span>
        <span class="av" style="width:32px;height:32px;background:#356e83">黃</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
          <b style="font-size:14px;font-weight:800">黃嘉俊</b>
          <small style="font-size:13px;color:#63736e">已訂 3 號枱 · 2 人已報名</small>
        </span>
        <span style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700;flex:0 0 auto">加入</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #cfe0d5;border-radius:20px;background:#eef6f0">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;flex:0 0 auto"><b class="disp" style="font-size:20px;line-height:1">今晚</b><small style="font-size:12px;color:#82908c">21:00 · 2 個鐘</small></span>
        <span style="align-self:stretch;width:1px;background:rgba(20,65,57,.12);flex:0 0 auto"></span>
        <span class="av" style="width:32px;height:32px;background:#155e52">你</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
          <b style="font-size:14px;font-weight:800">你</b>
          <small style="font-size:13px;color:#a66f1d;font-weight:700">2 人舉手 · 等你回覆</small>
        </span>
        <span style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:12px;background:#155e52;color:#fffefa;font-size:14px;font-weight:700;flex:0 0 auto">睇下</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(20,65,57,.12);border-radius:20px;background:#fffefa;opacity:.72">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;flex:0 0 auto"><b class="disp" style="font-size:20px;line-height:1">今晚</b><small style="font-size:12px;color:#82908c">21:30 · 1.5 個鐘</small></span>
        <span style="align-self:stretch;width:1px;background:rgba(20,65,57,.12);flex:0 0 auto"></span>
        <span class="av" style="width:32px;height:32px;background:#a66f1d">李</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
          <b style="font-size:14px;font-weight:800">李國強</b>
          <small style="font-size:13px;color:#63736e">SCAA 會所 · 2 人已報名</small>
        </span>
        <span style="font-size:13px;font-weight:700;color:#82908c;flex:0 0 auto">已滿</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(20,65,57,.12);border-radius:20px;background:#fffefa">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;flex:0 0 auto"><b class="disp" style="font-size:20px;line-height:1">聽日</b><small style="font-size:12px;color:#82908c">19:00 · 3 個鐘</small></span>
        <span style="align-self:stretch;width:1px;background:rgba(20,65,57,.12);flex:0 0 auto"></span>
        <span class="av" style="width:32px;height:32px;background:#247d5d">何</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
          <b style="font-size:14px;font-weight:800">何家俊</b>
          <small style="font-size:13px;color:#63736e">SCAA 會所 · 0 人已報名</small>
        </span>
        <span style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:12px;background:#f7f6ef;border:1px solid rgba(20,65,57,.12);font-size:14px;font-weight:700;flex:0 0 auto">加入</span>
      </div>

    </div>

    <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:12px;background:#f7f6ef;color:#63736e;font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#63736e" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
      <span style="flex-grow:1">你舉咗手 2 場，等緊人回覆</span><span>›</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border:1px solid rgba(20,65,57,.12);border-radius:12px;background:#f7f6ef;color:#63736e;font-size:13px;font-weight:700">
      <span style="flex-grow:1">公開你嘅空檔，其他人先知幾時可以約你</span><span>›</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
