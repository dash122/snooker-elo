<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
           font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: #155e52; } a:hover { color: #185149; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1000px; background: radial-gradient(circle at 72% -6%, rgba(211,174,89,.13), transparent 34%), #f4f3ed; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 16px;">

  <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">撳咗「睇下先」之後</div>

  <div style="background: #fff; border: 1px solid rgba(20,65,57,.12); border-radius: 20px; box-shadow: 0 12px 36px rgba(9,47,40,.08); padding: 20px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">今晚 · 會所 · 19:00 起</div>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #132521; font-variant-numeric: tabular-nums;">2</span>
          <span style="font-size: 14px; color: #63736e;">人確定</span>
        </div>
        <div style="font-size: 13px; color: #63736e;">估計 2–4 人</div>
      </div>
      <div style="text-align: right; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; color: #82908c;">開到檯機會</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #247d5d;">高</div>
      </div>
    </div>

    <div style="display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #e9ece6;">
      <div style="background: #155e52; flex-grow: 2;"></div>
      <div style="background: repeating-linear-gradient(135deg, #1d6a5e 0 5px, transparent 5px 10px); opacity: .55; flex-grow: 2;"></div>
      <div style="flex-grow: 4;"></div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">一定去</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">應該去</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid #a66f1d; border-radius: 12px; background: #a66f1d; color: #fff; font-size: 14px; font-weight: 600;">睇下先</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">今晚唔得</button>
    </div>

    <!-- 夠人就去 appears only where it means something: never on 一定去 (already
         committed) and never on 唔得, which it would contradict. -->
    <div style="border: 1px dashed rgba(20,65,57,.24); border-radius: 12px; background: #f7f6ef; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 14px; font-weight: 600; color: #132521;">夠人就去</span>
        <small style="font-size: 13px; color: #63736e;">揀個數，夠人我哋幫你轉做「一定去」</small>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; background: #fff; color: #63736e; font-size: 14px;">2 個</button>
        <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid transparent; border-radius: 999px; background: #155e52; color: #fff; font-size: 14px; font-weight: 600;">3 個</button>
        <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; background: #fff; color: #63736e; font-size: 14px;">4 個</button>
        <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; background: #fff; color: #63736e; font-size: 14px;">6 個</button>
      </div>
    </div>

    <div style="font-size: 13px; color: #63736e;">再多 <b style="color: #155e52;">1 個</b> 人確定，你就會自動轉做「一定去」。</div>
  </div>

  <!-- The line that makes a reader's own tap feel pivotal. Not a nag: it is a
       fact about the room, and it disappears the moment the threshold is met. -->
  <div style="background: #fff2d3; border: 1px solid rgba(166,111,29,.28); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
    <b style="font-size: 14px; color: #8b5910;">仲有 3 位設咗「夠人就去」</b>
    <span style="font-size: 13px; color: #8b5910;">佢哋各自等緊夠人。多一個人撳「一定去」，可能一次過拉齊四個。</span>
  </div>

  <div style="border-top: 1px solid rgba(20,65,57,.12); padding-top: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">點解要有呢個選項</div>
    <p style="margin: 0; font-size: 13px; color: #63736e; line-height: 1.75;">「有人我先上去」係球友本來就有嘅念頭，但目前冇地方講，所以乜都產生唔到。講得出之後，佢就變成一池「只要夠多人肯去，每個人都會去」嘅潛在供應——軟件好擅長解決，群組傾偈就好難。</p>
  </div>

</div>
</x-dc>
</body>
</html>
