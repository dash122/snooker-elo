<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
           font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: #155e52; } a:hover { color: #185149; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1000px; background: radial-gradient(circle at 72% -6%, rgba(211,174,89,.13), transparent 34%), #f4f3ed; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <button type="button" style="width: 34px; height: 34px; border: 1px solid rgba(20,65,57,.12); border-radius: 10px; background: #fff; display: grid; place-items: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#63736e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <b style="font-size: 16px; color: #132521;">SCAA</b>
      <span style="font-size: 12px; color: #82908c;">灣仔 · 士碌架 6 檯</span>
    </div>
  </div>

  <!-- One night at one venue. Two buttons, one count. No probability to
       self-assess, no threshold to configure, no state the app changes for you. -->
  <div style="background: #fff; border: 1px solid rgba(20,65,57,.12); border-radius: 20px; box-shadow: 0 12px 36px rgba(9,47,40,.08); padding: 22px 20px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">今晚 · 19:00 之後</div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 700; line-height: 1; color: {{v.countColour}}; font-variant-numeric: tabular-nums;">{{v.going}}</span>
        <span style="font-size: 17px; font-weight: 500; color: #132521;">人會去</span>
      </div>
      <sc-if value="{{v.hasInterested}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 14px; color: #63736e;">另外 {{v.interested}} 人有興趣</span>
      </sc-if>
    </div>

    <!-- Faces do the work a number cannot: 「阿明會去」 moves people, 「8 人」 does not. -->
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{v.faces}}" as="p" hint-placeholder-count="4">
        <span style="display: flex; align-items: center; gap: 6px; background: #f7f6ef; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; padding: 4px 12px 4px 4px;">
          <i style="width: 26px; height: 26px; border-radius: 50%; background: {{p.colour}}; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700;">{{p.short}}</i>
          <b style="font-size: 13px; font-weight: 500; color: #132521;">{{p.name}}</b>
        </span>
      </sc-for>
      <sc-if value="{{v.noFaces}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 14px; color: #82908c;">未有人話會去。做第一個？</span>
      </sc-if>
    </div>

    <!-- Two buttons. 有興趣 is not a probability claim — it is a subscription:
         「夠人叫我」, without asking anybody for a number. -->
    <div style="display: flex; gap: 10px;">
      <button type="button" onClick="{{ v.pickGoing }}"
        style="flex: 1; min-height: 54px; border: 1px solid {{v.goingBorder}}; border-radius: 14px; background: {{v.goingBg}}; color: {{v.goingFg}}; font-size: 16px; font-weight: 700;">{{v.goingLabel}}</button>
      <button type="button" onClick="{{ v.pickInterested }}"
        style="flex: 1; min-height: 54px; border: 1px solid {{v.intBorder}}; border-radius: 14px; background: {{v.intBg}}; color: {{v.intFg}}; font-size: 16px; font-weight: 600;">{{v.intLabel}}</button>
    </div>

    <div style="font-size: 13px; color: #63736e;">{{v.hint}}</div>
  </div>

  <!-- Other nights, as plain counts. No ranges, no confidence bands: a number
       people can act on, or a blank. -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">呢間會 · 其他日子</div>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{v.week}}" as="d" hint-placeholder-count="5">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px; border: 1px solid {{d.border}}; border-radius: 12px; background: {{d.bg}};">
          <small style="font-size: 12px; color: #82908c;">{{d.day}}</small>
          <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: {{d.colour}}; font-variant-numeric: tabular-nums;">{{d.n}}</strong>
        </div>
      </sc-for>
    </div>
  </div>

  <a href="#" style="display: flex; align-items: center; justify-content: space-between; background: #fffefa; border: 1px solid rgba(20,65,57,.12); border-radius: 16px; padding: 14px 16px; text-decoration: none;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <b style="font-size: 14px; color: #132521;">睇下其他波房</b>
      <small style="font-size: 12px; color: #63736e;">旺角今晚 4 人 · 太子 1 人</small>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#63736e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>

</div>
</x-dc>

<script data-dc-script data-props='{"going":{"editor":"int","default":8,"min":0,"max":14,"section":"今晚狀態"},"interested":{"editor":"int","default":3,"min":0,"max":10,"section":"今晚狀態"}}'>
class Component extends DCLogic {
  renderVals() {
    const baseGoing = Math.max(0, this.props.going ?? 8);
    const baseInterested = Math.max(0, this.props.interested ?? 3);
    const mine = this.state && this.state.mine !== undefined ? this.state.mine : null;

    /* The viewer's own tap moves the count immediately — that payback is the
       entire reason a tap is worth making. */
    const going = baseGoing + (mine === 'going' ? 1 : 0);
    const interested = baseInterested + (mine === 'interested' ? 1 : 0);

    const names = [
      { short: 'MI', name: '阿明', colour: '#155e52' },
      { short: 'SA', name: 'Sam', colour: '#1d6a5e' },
      { short: 'KE', name: '阿強', colour: '#0d443a' },
      { short: 'WI', name: 'Wing', colour: '#247d5d' },
    ];
    const faces = names.slice(0, Math.min(going, 4));
    if (mine === 'going') faces[faces.length - 1] = { short: '你', name: '你', colour: '#a66f1d' };

    const hint = mine === 'going'
      ? '你已經喺名單上面。想改隨時撳返。'
      : mine === 'interested'
        ? '夠人我哋會叫你一次。冇人會追你。'
        : '「有興趣」淨係一個訂閱 — 夠人先通知你，唔使你估幾成機會。';

    const week = [
      { day: '今晚', n: going, on: true },
      { day: '聽晚', n: 2, on: false },
      { day: '週三', n: 6, on: false },
      { day: '週四', n: 0, on: false },
      { day: '週五', n: 3, on: false },
    ].map((d) => ({
      day: d.day,
      n: d.n > 0 ? String(d.n) : '—',
      bg: d.on ? '#fff' : '#f7f6ef',
      border: d.on ? '#155e52' : 'rgba(20,65,57,.12)',
      colour: d.n >= 4 ? '#247d5d' : (d.n > 0 ? '#132521' : '#b3bdb8'),
    }));

    return {
      v: {
        going,
        interested,
        hasInterested: interested > 0,
        countColour: going >= 2 ? '#132521' : '#82908c',
        faces,
        noFaces: faces.length === 0,
        week,
        hint,
        pickGoing: () => this.setState({ mine: mine === 'going' ? null : 'going' }),
        pickInterested: () => this.setState({ mine: mine === 'interested' ? null : 'interested' }),
        goingLabel: mine === 'going' ? '✓ 我會去' : '我會去',
        goingBg: mine === 'going' ? '#155e52' : '#f7f6ef',
        goingFg: mine === 'going' ? '#ffffff' : '#155e52',
        goingBorder: mine === 'going' ? '#155e52' : 'rgba(20,65,57,.24)',
        intLabel: mine === 'interested' ? '✓ 有興趣' : '有興趣',
        intBg: mine === 'interested' ? '#a66f1d' : '#f7f6ef',
        intFg: mine === 'interested' ? '#ffffff' : '#63736e',
        intBorder: mine === 'interested' ? '#a66f1d' : 'rgba(20,65,57,.12)',
      },
    };
  }
}
</script>
</body>
</html>
