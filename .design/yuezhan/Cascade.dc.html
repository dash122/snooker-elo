<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
           font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: #155e52; } a:hover { color: #185149; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1000px; background: radial-gradient(circle at 72% -6%, rgba(211,174,89,.13), transparent 34%), #f4f3ed; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 20px;">

  <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">18:10 · 過門檻</div>

  <!-- The second push of the day, and the only one that is earned rather than
       scheduled: the reader's own state genuinely changed. -->
  <div style="background: #0d443a; border-radius: 20px; padding: 16px; box-shadow: 0 12px 36px rgba(9,47,40,.18); display: flex; gap: 12px; align-items: flex-start;">
    <div style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; background: radial-gradient(circle at 35% 30%, #f0d091, #d5a94d); display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0d443a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <b style="font-size: 14px; color: #f9f7ee;">今晚夠人喇 — 4 個確定</b>
      <span style="font-size: 13px; color: #bdd0c9; line-height: 1.6;">你設咗「夠 3 個就去」，而家達到咗，所以你已經轉做「一定去」。</span>
      <span style="font-size: 12px; color: #8faea5; margin-top: 4px;">SCAA 約戰 · 而家</span>
    </div>
  </div>

  <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">打開 App 之後</div>

  <div style="background: #fff; border: 1px solid rgba(20,65,57,.12); border-radius: 20px; box-shadow: 0 12px 36px rgba(9,47,40,.08); padding: 20px; display: flex; flex-direction: column; gap: 16px;">

    <!-- The club made this commitment on the member's behalf, so it is said
         plainly rather than left for them to notice their own row changed. -->
    <div style="background: #eef6f0; border: 1px solid #cfe0d5; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
      <b style="font-size: 14px; color: #132521;">夠人喇 — 你而家係「一定去」</b>
      <span style="font-size: 13px; color: #63736e;">你設咗嘅條件達到咗。想改隨時撳返下面。</span>
    </div>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">今晚 · 會所 · 19:00 起</div>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #132521; font-variant-numeric: tabular-nums;">4–6</span>
          <span style="font-size: 14px; color: #63736e;">人</span>
        </div>
        <div style="font-size: 13px; color: #63736e;">4 人確定 · 其餘係估計</div>
      </div>
      <div style="text-align: right; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; color: #82908c;">開到檯機會</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #247d5d;">高</div>
      </div>
    </div>

    <div style="display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #e9ece6;">
      <div style="background: #155e52; flex-grow: 4;"></div>
      <div style="background: repeating-linear-gradient(135deg, #1d6a5e 0 5px, transparent 5px 10px); opacity: .55; flex-grow: 2;"></div>
      <div style="flex-grow: 2;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
      <span style="display: flex; align-items: center; gap: 6px; background: #f7f6ef; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; padding: 4px 12px 4px 4px;">
        <i style="width: 26px; height: 26px; border-radius: 50%; background: #155e52; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700;">MI</i>
        <b style="font-size: 13px; font-weight: 500; color: #132521;">阿明</b>
      </span>
      <span style="display: flex; align-items: center; gap: 6px; background: #f7f6ef; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; padding: 4px 12px 4px 4px;">
        <i style="width: 26px; height: 26px; border-radius: 50%; background: #1d6a5e; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700;">SA</i>
        <b style="font-size: 13px; font-weight: 500; color: #132521;">Sam</b>
      </span>
      <span style="display: flex; align-items: center; gap: 6px; background: #f7f6ef; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; padding: 4px 12px 4px 4px;">
        <i style="width: 26px; height: 26px; border-radius: 50%; background: #a66f1d; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700;">你</i>
        <b style="font-size: 13px; font-weight: 500; color: #132521;">你</b>
      </span>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid #155e52; border-radius: 12px; background: #155e52; color: #fff; font-size: 14px; font-weight: 600;">一定去</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">應該去</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">睇下先</button>
      <button type="button" style="flex: 1 1 80px; min-height: 46px; border: 1px solid rgba(20,65,57,.12); border-radius: 12px; background: #f7f6ef; color: #63736e; font-size: 14px; font-weight: 600;">今晚唔得</button>
    </div>
  </div>

  <div style="border-top: 1px solid rgba(20,65,57,.12); padding-top: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">連鎖反應</div>
    <p style="margin: 0; font-size: 13px; color: #63736e; line-height: 1.75;">三個各自唔會單獨上去嘅人一齊去咗，因為每個人嘅參與都有條件，而系統幫佢哋解決咗嗰個條件。升級係單向嘅——之後有人退出都唔會靜靜哋撤銷，因為嗰陣佢可能已經出咗門。</p>
  </div>

</div>
</x-dc>
</body>
</html>
