<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
           font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: #155e52; } a:hover { color: #185149; }
    button { font: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1000px; background: radial-gradient(circle at 72% -6%, rgba(211,174,89,.13), transparent 34%), #f4f3ed; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .2em; color: #9a6e24;">TONIGHT</div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #132521;">今晚邊度有人</h1>
  </div>

  <!-- The open directory: no membership, no joining. Anyone can look into any
       venue, which is what makes the product reach past one club's roster. -->
  <div style="display: flex; gap: 8px;">
    <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid transparent; border-radius: 999px; background: #155e52; color: #fff; font-size: 14px; font-weight: 600;">附近</button>
    <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; background: #fff; color: #63736e; font-size: 14px;">常去</button>
    <button type="button" style="min-height: 36px; padding: 6px 14px; border: 1px solid rgba(20,65,57,.12); border-radius: 999px; background: #fff; color: #63736e; font-size: 14px;">全港</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">

    <!-- Ranked by people, not by distance. The map is what every other app has;
         「邊度有人」 is the only thing this product knows and nobody else does. -->
    <a href="#" style="display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid rgba(20,65,57,.12); border-radius: 16px; box-shadow: 0 12px 36px rgba(9,47,40,.08); padding: 16px; text-decoration: none;">
      <div style="flex: 0 0 auto; width: 52px; text-align: center;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #247d5d; font-variant-numeric: tabular-nums;">8</div>
        <div style="font-size: 11px; color: #82908c;">會去</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 16px; color: #132521;">SCAA</b>
        <span style="font-size: 13px; color: #63736e;">灣仔 · 1.2km · 士碌架 6 檯</span>
        <span style="font-size: 12px; color: #82908c;">阿明、Sam、阿強 +5</span>
      </div>
    </a>

    <a href="#" style="display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid rgba(20,65,57,.12); border-radius: 16px; box-shadow: 0 12px 36px rgba(9,47,40,.08); padding: 16px; text-decoration: none;">
      <div style="flex: 0 0 auto; width: 52px; text-align: center;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #247d5d; font-variant-numeric: tabular-nums;">4</div>
        <div style="font-size: 11px; color: #82908c;">會去</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 16px; color: #132521;">旺角波房</b>
        <span style="font-size: 13px; color: #63736e;">旺角 · 3.4km · 中式八球 4 檯</span>
        <span style="font-size: 12px; color: #82908c;">Wing、阿 King +2</span>
      </div>
    </a>

    <a href="#" style="display: flex; align-items: center; gap: 14px; background: #fffefa; border: 1px solid rgba(20,65,57,.12); border-radius: 16px; padding: 16px; text-decoration: none;">
      <div style="flex: 0 0 auto; width: 52px; text-align: center;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #132521; font-variant-numeric: tabular-nums;">1</div>
        <div style="font-size: 11px; color: #82908c;">會去</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 16px; color: #132521;">太子波房</b>
        <span style="font-size: 13px; color: #63736e;">太子 · 2.0km · 士碌架 3 檯</span>
        <span style="font-size: 12px; color: #82908c;">另有 3 人有興趣</span>
      </div>
    </a>

    <!-- A venue with nobody in it is still listed, and says so plainly. Hiding
         the quiet ones would make the directory a lie and strand every new
         venue in a cold start it can never leave. -->
    <a href="#" style="display: flex; align-items: center; gap: 14px; background: #fffefa; border: 1px solid rgba(20,65,57,.12); border-radius: 16px; padding: 16px; text-decoration: none; opacity: .72;">
      <div style="flex: 0 0 auto; width: 52px; text-align: center;">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #b3bdb8;">—</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 16px; color: #132521;">荃灣波房</b>
        <span style="font-size: 13px; color: #63736e;">荃灣 · 6.4km · 士碌架 8 檯</span>
        <span style="font-size: 12px; color: #82908c;">今晚未有人 · 平時星期三最多人</span>
      </div>
    </a>

  </div>

  <div style="border-top: 1px solid rgba(20,65,57,.12); padding-top: 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 12px; letter-spacing: .08em; color: #82908c;">點解係公開目錄</div>
    <p style="margin: 0; font-size: 13px; color: #63736e; line-height: 1.8;">冇「加入球會」呢一步。任何人都可以望入任何一間波房，所以一個新用戶第一次開 App 就已經有嘢睇——唔使先揾人批准。地圖同檯數人人做得到；<b style="color: #132521;">「今晚邊度有人」只有我哋知</b>，因為得我哋手上有意向資料。</p>
  </div>

</div>
</x-dc>
</body>
</html>
